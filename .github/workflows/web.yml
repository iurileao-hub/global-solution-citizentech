# Camada 1 (web/): tipos, testes e build a cada mudança. O teste do contrato confere que a busca em TypeScript
# responde às 130 perguntas rotuladas e às buscas de escola como o núcleo Python (data/regressao_web.json).
name: web
on:
  push:
    paths: ["web/**", "data/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "data/**", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
